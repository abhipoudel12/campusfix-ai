AWSTemplateFormatVersion: '2010-09-09'
Description: CampusFix AI temporary Lambda code artifact bucket — stores deployment zip only, never submitted images.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    ref:
      - at: docs/milestone-2-backend.md
        has: deployment and cleanup order
        scope: stack
Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Metadata:
      com.aws.cloudformation.Context:
        why: CloudFormation needs an existing S3 object before it can create the Lambda function; seven-day expiry limits artifact storage
        must:
          - Never store submitted images
          - Empty bucket before stack deletion
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-code-artifacts
            Status: Enabled
            ExpirationInDays: 7
      Tags:
        - Key: Project
          Value: CampusFixAI
  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: rejects non-TLS artifact reads and writes
        must:
          - Deny insecure transport
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub '${ArtifactBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'
Outputs:
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
